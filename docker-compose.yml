version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: eaz_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: eaz_community
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: eaz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  typesense:
    image: typesense/typesense:26.0
    container_name: eaz_typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key}
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data

volumes:
  mongodb_data:
  redis_data:
  typesense_data:
